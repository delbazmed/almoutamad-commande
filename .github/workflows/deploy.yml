name: Deploy commande
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.loads(os.environ['SA'], strict=False)
          pid = d.get('project_id')
          print('Key project_id:', pid)
          if pid != 'almoutamad-commande':
              sys.exit('ERREUR: la cle appartient au projet %s et non a almoutamad-commande' % pid)
          json.dump(d, open('/tmp/sa.json', 'w'))
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@latest deploy --only hosting --project almoutamad-commande --non-interactive
