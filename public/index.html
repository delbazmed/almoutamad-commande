<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Moutamad — Pièces auto</title>
<meta name="theme-color" content="#0f2438">
<meta name="description" content="Commandez en ligne en une minute, paiement à la livraison. Al Moutamad — pièces détachées auto.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Al Moutamad">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://almoutamad-commande.web.app/">
<meta property="og:title" content="Al Moutamad — Pièces auto">
<meta property="og:description" content="Commandez en ligne en une minute, paiement à la livraison. Al Moutamad — pièces détachées auto.">
<meta property="og:image" content="https://almoutamad-commande.web.app/img/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--navy:#0f2438;--navy2:#183653;--orange:#ff7a1a;--bg:#f4f6f9;--ink:#1b2430;--mut:#6b7684;--ok:#1fa35b;--err:#d93636}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px}
.brand b{display:block;font-size:19px;letter-spacing:.3px}
.brand span{font-size:12px;color:#9fb3c8}
.desc{white-space:pre-line;font-size:14px;line-height:1.55;color:var(--ink);margin:8px 0 4px}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(15,36,56,.08);overflow:hidden;margin-bottom:14px}
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2));padding:18px;display:flex;justify-content:center;position:relative}
.badge{position:absolute;top:12px;left:12px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;z-index:1}
.info{padding:16px}
h1{font-size:20px;line-height:1.3}
.compat{color:var(--mut);font-size:14px;margin-top:4px}
.price{display:flex;align-items:baseline;gap:8px;margin:12px 0}
.price b{font-size:30px;color:var(--orange)}
.price b.np{font-size:20px}
.price small{color:var(--mut);font-size:13px}
ul.pts{list-style:none;display:grid;gap:6px;font-size:14px}
ul.pts li::before{content:"✓ ";color:var(--ok);font-weight:700}
h2{font-size:17px;margin-bottom:12px}
form{padding:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:13px;border:1.5px solid #d6dce4;border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--orange)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--err);font-size:12px;margin-top:4px;display:none}
.bad input,.bad select{border-color:var(--err)}
.bad .err{display:block}
.total{display:flex;justify-content:space-between;background:#fff4ec;border-radius:10px;padding:12px;margin-top:14px;font-weight:700}
.total[hidden]{display:none}
button.cta{width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
button.cta:active{transform:scale(.98)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.float{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.float a{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;color:#fff;font-size:15px}
.wa{background:#25d366}.tel{background:var(--navy)}
.sheet{position:fixed;inset:0;background:rgba(15,36,56,.55);display:flex;align-items:flex-end;z-index:20}
.sheet[hidden]{display:none}
.sheet-card{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 24px;display:grid;gap:10px}
.sheet-card b{font-size:16px;text-align:center}
.sheet-card a{display:block;text-align:center;padding:15px;border-radius:12px;background:var(--navy);color:#fff;text-decoration:none;font-size:18px;font-weight:700}
.sheet-card button{padding:13px;border:0;border-radius:12px;background:#eef1f5;color:var(--ink);font-size:16px;font-weight:600}
.hero img{width:100%;height:auto;max-width:360px;aspect-ratio:5/4;object-fit:cover;object-position:50% 62%;border-radius:12px;display:block}
.thumbs{display:flex;gap:8px;padding:10px 16px 0}
.thumbs button{width:62px;height:62px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
.thumbs button.on{border-color:var(--orange)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.search{margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(15,36,56,.08);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.pcard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e9edf2}
.pc-body{padding:10px;display:grid;gap:6px;font-size:14px;align-content:start;flex:1}
.pc-price{color:var(--orange);font-weight:800}
.pc-cta{background:var(--orange);color:#fff;text-align:center;border-radius:8px;padding:8px;font-weight:700;align-self:end}
.back{display:inline-block;margin-bottom:10px;color:var(--navy);font-weight:600;text-decoration:none;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 14px}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <rect width="48" height="48" rx="12" fill="#ff7a1a"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#0f2438" stroke-width="4"/>
    <circle cx="24" cy="24" r="4" fill="#0f2438"/>
    <path d="M24 10v6M24 32v6M10 24h6M32 24h6" stroke="#0f2438" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="brand"><b>Al Moutamad</b><span>Pièces détachées auto</span></div>
</header>

<main id="app"><p class="empty">Chargement…</p></main>

<div class="float">
  <a class="wa" id="wa" href="#">WhatsApp</a>
  <a class="tel" id="callBtn" href="#">Appeler</a>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <b>Appeler Al Moutamad</b>
    <div id="sheetLinks" style="display:grid;gap:10px"></div>
    <button type="button" id="sheetClose">Fermer</button>
  </div>
</div>

<script src="config.js"></script>
<script src="geo.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("fr-FR").replace(/[  ]/g," ")+" DA";
const pad=n=>String(n).padStart(2,"0");
const QL={origine:"Pièce d'origine",adaptable:"Pièce adaptable"};
const app=$("app");

/* ---------- Meta Pixel ---------- */
if(CONFIG.pixelId){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',CONFIG.pixelId);fbq('track','PageView');
}

/* ---------- UTM ---------- */
const q=new URLSearchParams(location.search);
const utm=["utm_source","utm_campaign","utm_content"].map(k=>q.get(k)?k.replace("utm_","")+"="+q.get(k):"").filter(Boolean).join(" | ");
const catUrl=()=>{const u=new URLSearchParams(location.search);u.delete("p");const s=u.toString();return "/"+(s?"?"+s:"")};
const withParams=(set,del)=>{const u=new URLSearchParams(location.search);(del||[]).forEach(k=>u.delete(k));Object.entries(set||{}).forEach(([k,v])=>u.set(k,v));const s=u.toString();return s?"?"+s:location.pathname};

/* ---------- WhatsApp / appels ---------- */
const wa=t=>"https://wa.me/"+CONFIG.phone+"?text="+encodeURIComponent(t);
const calls=CONFIG.calls||[], callBtn=$("callBtn"), sheet=$("sheet");
if(calls.length>1){
  $("sheetLinks").innerHTML=calls.map(c=>`<a href="tel:${esc(c[1])}" style="display:block;text-align:center;padding:15px;border-radius:12px;background:var(--navy);color:#fff;text-decoration:none;font-size:18px;font-weight:700">📞 ${esc(c[0])}</a>`).join("");
  callBtn.addEventListener("click",e=>{e.preventDefault();sheet.hidden=false});
}else if(calls.length===1){callBtn.href="tel:"+calls[0][1]}
else{callBtn.hidden=true}
$("sheetClose").onclick=()=>sheet.hidden=true;
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.hidden=true});

/* ---------- Journal des commandes (Google Sheets) ---------- */
function logOrder(payload){
  if(!CONFIG.sheetUrl)return;
  try{
    const body=JSON.stringify(payload);
    const sent=navigator.sendBeacon&&navigator.sendBeacon(CONFIG.sheetUrl,new Blob([body],{type:"text/plain;charset=UTF-8"}));
    if(!sent)fetch(CONFIG.sheetUrl,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=UTF-8"},body}).catch(()=>{});
  }catch(_){}
}

/* ---------- Catalogue ---------- */
function renderCatalog(products){
  document.title="Al Moutamad — Pièces auto";
  $("wa").href=wa("Bonjour, je cherche une pièce auto.");
  app.innerHTML=`<input class="search" id="s" type="search" placeholder="Rechercher une pièce, un véhicule, une référence…" aria-label="Rechercher">
  <div class="grid" id="grid"></div><p class="empty" id="none" hidden>Aucune pièce trouvée. Contactez-nous sur WhatsApp.</p>`;
  const grid=$("grid");
  const draw=list=>{
    grid.innerHTML=list.map(p=>`<a class="pcard" href="${esc(withParams({p:p.id}))}">
      <img src="${esc((p.images||[])[0]||"")}" alt="${esc(p.title)}" loading="lazy">
      <div class="pc-body"><b>${esc(p.title)}</b><span class="pc-price">${p.price?esc(fmt(p.price)):"Prix sur demande"}</span><span class="pc-cta">Commander</span></div></a>`).join("");
    $("none").hidden=list.length>0;
  };
  draw(products);
  $("s").addEventListener("input",e=>{
    const t=e.target.value.trim().toLowerCase();
    draw(products.filter(p=>[p.title,p.name,p.compat,p.ref,p.badge].join(" ").toLowerCase().includes(t)));
  });
}

/* ---------- Page produit ---------- */
function renderProduct(p,many){
  document.title=p.title+" — Al Moutamad";
  $("wa").href=wa("Bonjour, je suis intéressé par : "+p.title);
  const imgs=p.images||[];
  const qlabel=QL[p.quality]||"";
  app.innerHTML=`
  ${many?`<a class="back" href="${esc(catUrl())}">← Toutes les pièces</a>`:""}
  <section class="card">
    <div class="hero">
      ${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}
      ${imgs[0]?`<img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.title)}">`:""}
    </div>
    ${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>`<button type="button" class="${i?"":"on"}" data-src="${esc(s)}" aria-label="Photo ${i+1}"><img src="${esc(s)}" alt=""></button>`).join("")}</div>`:""}
    <div class="info">
      <h1>${esc(p.title)}</h1>
      ${p.compat?`<p class="compat">${esc(p.compat)}</p>`:""}
      ${p.description?`<p class="desc">${esc(p.description)}</p>`:""}
      <div class="price"><b id="priceTxt" class="${p.price?"":"np"}">${p.price?esc(fmt(p.price)):"Prix sur demande"}</b><small>Paiement à la livraison</small></div>
      <ul class="pts">
        ${qlabel?`<li>${esc(qlabel)}</li>`:""}
        <li>Photos réelles de la pièce</li>
        <li>Livraison dans toutes les wilayas</li>
        <li>Confirmation par téléphone avant l'envoi</li>
      </ul>
    </div>
  </section>
  <section class="card">
    <form id="f" novalidate>
      <h2>Commander maintenant</h2>
      <div class="fld"><label for="nom">Nom complet</label>
        <input id="nom" autocomplete="name" placeholder="Ex : Karim Benali"><div class="err">Nom requis</div></div>
      <div class="fld"><label for="tel">Téléphone</label>
        <input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0X XX XX XX XX"><div class="err">Numéro invalide (05, 06 ou 07 + 8 chiffres)</div></div>
      <div class="row">
        <div class="fld"><label for="wil">Wilaya</label>
          <select id="wil"><option value="">Choisir</option></select><div class="err">Requis</div></div>
        <div class="fld"><label for="com">Commune</label>
          <select id="com" disabled><option value="">Choisir la wilaya d'abord</option></select><div class="err">Requis</div></div>
      </div>
      <div class="fld"><label for="veh">Véhicule (marque, modèle, année)</label>
        <input id="veh" value="${esc(p.vehiclePrefill||"")}" placeholder="${esc(p.vehiclePlaceholder||"Marque Modèle — Année")}"><div class="err">Précisez l'année</div></div>
      ${p.motorisation?`<div class="fld"><label for="mot">Motorisation</label>
        <select id="mot"><option value="">Choisir</option><option value="Essence">Essence</option><option value="Diesel">Diesel</option></select><div class="err">Requis</div></div>`:""}
      <div class="fld"><label for="qte">Quantité</label>
        <select id="qte"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <input class="hp" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="total" id="totalRow" ${p.price?"":"hidden"}><span>Total</span><span id="tot">${p.price?esc(fmt(p.price)):""}</span></div>
      <button class="cta" type="submit">Confirmer la commande</button>
      <p class="note">Votre commande s'ouvre dans WhatsApp, appuyez sur « Envoyer ». Nous vous rappelons pour confirmer.</p>
    </form>
  </section>`;

  if(window.fbq)fbq("track","ViewContent",{content_name:p.title,content_ids:[p.id]});

  document.querySelectorAll(".thumbs button").forEach(b=>b.addEventListener("click",()=>{
    $("mainImg").src=b.dataset.src;
    document.querySelectorAll(".thumbs button").forEach(x=>x.classList.toggle("on",x===b));
  }));

  /* wilaya -> commune */
  const wil=$("wil"),com=$("com"),qte=$("qte");
  WIL.forEach(w=>wil.add(new Option(pad(w[0])+" "+w[1],w[0])));
  wil.addEventListener("change",()=>{
    com.length=0;
    const L=COM[wil.value]||[];
    com.add(new Option(L.length?"Choisir la commune":"Choisir la wilaya d'abord",""));
    L.forEach(n=>com.add(new Option(n,n)));
    com.disabled=!L.length;
  });
  qte.addEventListener("change",()=>{if(p.price)$("tot").textContent=fmt(p.price*qte.value)});

  /* validation */
  document.querySelectorAll("#f input,#f select").forEach(el=>{
    const clear=()=>el.closest(".fld")&&el.closest(".fld").classList.remove("bad");
    el.addEventListener("input",clear);el.addEventListener("change",clear);
  });
  const check=(id,ok)=>{$(id).closest(".fld").classList.toggle("bad",!ok);return ok};

  $("f").addEventListener("submit",e=>{
    e.preventDefault();
    if($("hp").value)return; /* robot */
    const tel=$("tel").value.replace(/[\s.\-]/g,"").replace(/^\+213/,"0");
    const v=[
      check("nom",$("nom").value.trim().length>=3),
      check("tel",/^0[567]\d{8}$/.test(tel)),
      check("wil",!!wil.value),
      check("com",!!com.value),
      check("veh",/\d{4}/.test($("veh").value))
    ];
    if(p.motorisation)v.push(check("mot",!!$("mot").value));
    if(v.includes(false)){const b=document.querySelector(".bad");if(b)b.scrollIntoView({behavior:"smooth",block:"center"});return}

    const n=+qte.value;
    const oid="AM-"+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).toUpperCase().slice(2,4);
    const wilText=wil.options[wil.selectedIndex].text;
    const unit=p.unit||"pièce(s)";
    const total=p.price?p.price*n:null;
    const lines=[
      "🛒 NOUVELLE COMMANDE",
      "N° commande : "+oid,
      "Produit : "+p.name+(p.ref?" — réf. "+p.ref:""),
      qlabel?"Qualité : "+qlabel:null,
      "Quantité : "+n+" "+unit,
      total?"Total : "+fmt(total)+" (paiement à la livraison)":"Paiement à la livraison (prix confirmé par téléphone)",
      "",
      "Nom : "+$("nom").value.trim(),
      "Téléphone : "+tel,
      "Wilaya : "+wilText,
      "Commune : "+com.value,
      "Véhicule : "+$("veh").value.trim(),
      p.motorisation?"Motorisation : "+$("mot").value:null,
      utm?"Source : "+utm:null
    ].filter(x=>x!==null);

    logOrder({id:oid,produit:p.name,ref:p.ref||"",qualite:qlabel,quantite:n,total:total||"",
      nom:$("nom").value.trim(),telephone:tel,wilaya:wilText,commune:com.value,
      vehicule:$("veh").value.trim(),motorisation:p.motorisation?$("mot").value:"",source:utm,website:""});
    if(window.fbq)fbq("track","Lead",total?{value:total,currency:"DZD",content_name:p.title}:{content_name:p.title});
    location.href=wa(lines.join("\n"));
  });
}

/* ---------- Démarrage ---------- */
fetch("products.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  const products=(d.products||[]).filter(p=>p.active!==false);
  if(!products.length){app.innerHTML='<p class="empty">Aucune pièce disponible pour le moment. Contactez-nous.</p>';return}
  const id=q.get("p")||(location.pathname.match(/\/p\/([a-z0-9-]+)\/?$/)||[])[1];
  let prod=products.find(p=>p.id===id);
  if(!prod&&!id&&products.length===1)prod=products[0];
  prod?renderProduct(prod,products.length>1):renderCatalog(products);
}).catch(()=>{app.innerHTML='<p class="empty">Chargement impossible. Réessayez ou appelez-nous.</p>'});
})();
</script>
</body>
</html>
